[workspace]
resolver = "2"
members = ["ymp-rust/crates/*"]

[workspace.package]
version = "0.4.4"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
ymp-core = { path = "ymp-rust/crates/ymp-core" }
ymp-storage = { path = "ymp-rust/crates/ymp-storage" }
ymp-providers = { path = "ymp-rust/crates/ymp-providers" }
ymp-workspace = { path = "ymp-rust/crates/ymp-workspace" }
ymp-runtime = { path = "ymp-rust/crates/ymp-runtime" }
ymp-tui = { path = "ymp-rust/crates/ymp-tui" }
ymp-cli = { path = "ymp-rust/crates/ymp-cli" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_distr = "0.4"
sha2 = "0.10"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
libc = "0.2"
walkdir = "2"
tempfile = "3"
# `unstable-widget-ref` draws the file explorer widget, which renders by reference.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info", "unstable-widget-ref"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-themes = { version = "0.3.0", default-features = false }
# Keys are mapped by ymp itself, so the widget's own terminal backend conversions are left out.
ratatui-explorer = { version = "0.3.0", default-features = false }
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
# The pure-Rust regex engine, so no C library is built. two-face and tui-syntax-highlight must name
# the same one.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
tui-syntax-highlight = { version = "0.2.0", default-features = false, features = ["regex-fancy"] }
