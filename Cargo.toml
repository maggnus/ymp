[workspace]
members = [
    "crates/ymp-cli",
    "crates/ymp-domain",
    "crates/ymp-kernel",
    "crates/ymp-runtime",
    "crates/ymp-storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
