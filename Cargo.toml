[workspace]
members = [
    "crates/ymp-cli",
    "crates/ymp-domain",
    "crates/ymp-kernel",
    "crates/ymp-runtime",
    "crates/ymp-storage",
    "crates/ymp-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
