name: Check
on:
  push:
  pull_request:
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ymp-bridges/claude/package-lock.json
      - run: npm ci --prefix ymp-bridges/claude --no-audit --no-fund
      - run: npm run check --prefix ymp-bridges/claude
      - run: npm test --prefix ymp-bridges/claude
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
