[package]
name = "ymp-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
crc32fast = "1.5.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ymp-domain = { path = "../ymp-domain" }
ymp-kernel = { path = "../ymp-kernel" }

[features]
# Test-only one-shot fault injection for the acceptance tests of atomicity and
# indeterminate-commit behavior. Never enabled by default: production builds
# of this crate expose no way to fake an append outcome.
fault-injection = []

[dev-dependencies]
# The acceptance tests exercise the fault-injection seam; the self dev-
# dependency enables the feature for test targets only, never for downstream
# or production builds.
ymp-storage = { path = ".", features = ["fault-injection"] }
# Test-only assembly of the admitted execution scenario over the SQLite
# journal; ymp-runtime depends only on ymp-domain and ymp-kernel, so this
# dev-dependency creates no build cycle.
ymp-runtime = { path = "../ymp-runtime" }

[lints]
workspace = true
